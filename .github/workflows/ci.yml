name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and format
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: ShellCheck
        run: shellcheck -S warning nauka.tmux install.sh scripts/nauka-run
      - name: Tests
        run: go test ./...
      - name: Build and CLI
        run: |
          make build
          ./bin/nauka --version
          ./bin/nauka --help
      - name: make install
        run: |
          make install DESTDIR="$RUNNER_TEMP/pkg" PREFIX=/usr
          test -x "$RUNNER_TEMP/pkg/usr/bin/nauka"
